name: 构建并部署作品集

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_URL: https://gallery.faster.us.kg
  BASE_PATH: /

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 构建 Astro 网站
        run: npm run build

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传 GitHub Pages 文件
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
